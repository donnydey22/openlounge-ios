name: pjsip-ios
on: { push: { branches: [pjsip-rebuild] }, workflow_dispatch: {} }
concurrency: { group: pjsip-ios, cancel-in-progress: true }
jobs:
  xcframework:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - run: brew install cmake >/dev/null 2>&1 || true
      - run: |
          git clone -q --depth 1 -b 2.17 https://github.com/pjsip/pjproject.git
          git clone -q --depth 1 -b v1.5.2 https://github.com/xiph/opus.git
      - name: libopus device + simulator
        run: |
          for t in device:iphoneos sim:iphonesimulator; do n=${t%%:*}; sdk=${t##*:}
            cmake -S opus -B ob-$n -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=$sdk -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_INSTALL_PREFIX=$PWD/opus-$n -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF >/dev/null
            cmake --build ob-$n --target install -j4 >/dev/null; done; ls opus-*/lib
      - name: pjproject device + simulator (SRTP, opus, VideoToolbox)
        working-directory: pjproject
        run: |
          cat > pjlib/include/pj/config_site.h <<'C'
          #define PJ_CONFIG_IPHONE 1
          #define PJMEDIA_HAS_SRTP 1
          #define PJMEDIA_HAS_VIDEO 1
          #define PJMEDIA_HAS_VID_TOOLBOX_CODEC 1
          #include <pj/config_site_sample.h>
          C
          build() { make distclean >/dev/null 2>&1 || true
            env CXXFLAGS="-std=c++17" ARCH="-arch arm64" $1 ./configure-iphone --with-opus=$PWD/../opus-$2 >/dev/null
            grep -q "PJMEDIA_HAS_OPUS_CODEC 1" pjmedia/include/pjmedia-codec/config_auto.h && echo "opus ON ($2)"
            make dep >/dev/null 2>&1 && make -j4 >/dev/null
            mkdir -p ../out/$2; libtool -static -o ../out/$2/libpjproject.a $(find . -path ./pjsip-apps -prune -o -path "*/lib/*.a" -print | grep -v pjsua2 | grep -v libpjsdp) ../opus-$2/lib/libopus.a ; }
          build "" device
          build "DEVPATH=$(xcrun --sdk iphonesimulator --show-sdk-platform-path)/Developer MIN_IOS=-mios-simulator-version-min=15.0" sim
          mkdir -p ../out/include; for d in pjlib pjlib-util pjnath pjmedia pjsip; do cp -R $d/include/* ../out/include/; done
      - run: xcodebuild -create-xcframework -library out/device/libpjproject.a -library out/sim/libpjproject.a -output pjproject.xcframework && mv out/include pjinclude
      - uses: actions/upload-artifact@v4
        with: { name: pjproject-2.17-xcframework, path: pjproject.xcframework }
      - uses: actions/upload-artifact@v4
        with: { name: pjproject-2.17-headers, path: pjinclude }
  app:
    needs: xcframework
    runs-on: macos-26
    timeout-minutes: 90
    env: { EXPO_NO_TELEMETRY: '1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }  # no caches: from-scratch build
      - uses: actions/download-artifact@v4
        with: { name: pjproject-2.17-xcframework, path: modules/openlounge-call-engine/ios/pjproject.xcframework }
      - uses: actions/download-artifact@v4
        with: { name: pjproject-2.17-headers, path: modules/openlounge-call-engine/ios/pjinclude }
      - run: npm ci
      - run: npx tsc --noEmit
      - name: guard — no WebRTC, no setActive in app code
        run: |
          ! grep -rniE "webrtc|mediasoup-client" package.json App.tsx src modules --include=*.ts --include=*.tsx --include=*.swift --include=*.json --include=*.podspec | grep -v "^\S*:\s*//"
          ! grep -rn "setActive(" modules --include=*.swift | grep -v "//.*setActive"
      - name: prebuild + simulator build (unsigned)
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install --clean
          cd ios && pod install >/dev/null
          WS=$(ls -d *.xcworkspace | head -1); SCHEME=${WS%.xcworkspace}
          rm -rf ~/Library/Developer/Xcode/DerivedData
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO EXCLUDED_ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO -derivedDataPath $PWD/dd clean build > ../xb.log 2>&1 && rc=0 || rc=$?
          grep -E ' error: |\*\* BUILD' ../xb.log | sort -u | head -60 || true
          exit $rc
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: xcodebuild-log, path: xb.log }
      - name: fail if any WebRTC / libpeerconnection symbol, import or dependency remains
        run: |
          set -euo pipefail
          ! grep -rniE "webrtc|peerconnection" package.json package-lock.json ios/Podfile.lock modules --include=* -l | grep -v PLAN.md
          APP=$(find ios/dd/Build/Products -name "*.app" -maxdepth 3 | head -1); BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          ! (nm -a "$BIN" 2>/dev/null; find "$APP" -name "*.framework" -exec sh -c 'ls "$1"' _ {} \;) | grep -iE "webrtc|peerconnection|RTCPeer"
          echo "no WebRTC symbols in $BIN"
  simulator-matrix:
    needs: xcframework
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: donnydey22/openlounge, ref: pjsip-rebuild, path: ol }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 3.1.74, actions-cache-folder: "" }
      - uses: actions/download-artifact@v4
        with: { name: pjproject-2.17-xcframework, path: modules/openlounge-call-engine/ios/pjproject.xcframework }
      - uses: actions/download-artifact@v4
        with: { name: pjproject-2.17-headers, path: modules/openlounge-call-engine/ios/pjinclude }
      - name: build XCTest harness for the simulator (engine ol_sfu.c)
        working-directory: modules/openlounge-call-engine/ios-harness
        run: |
          set -euo pipefail
          cp ../ios/ol_sfu.c ../ios/ol_sfu_video.c Sources/OLSfu/ && cp ../ios/ol_sfu.h ../ios/ol_sfu_video.h Sources/OLSfu/include/ && mkdir -p Sources/OLVideo && cp ../ios/OLVideoCodec.swift Sources/OLVideo/
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "SIM=$SIM" >> $GITHUB_ENV; xcrun simctl boot "$SIM" || true
          # SwiftPM scheme naming differs across Xcode versions (OLSfuHarness / OLSfuHarness-Package / OLSfu): pick what exists
          xcodebuild -list -json > ../../../xl.json 2>../../../xl.err || { cat ../../../xl.err | tail -40; exit 1; }
          SCHEME=$(python3 -c 'import json; s=json.load(open("../../../xl.json"))["workspace"]["schemes"]; print(next((x for x in ["OLSfuHarness","OLSfuHarness-Package","OLSfu"] if x in s), s[0]))')
          echo "schemes: $(cat ../../../xl.json | tr -d '\n ')  -> $SCHEME"; echo "HSCHEME=$SCHEME" >> $GITHUB_ENV
          # SwiftPM autogenerated scheme intermittently vanishes ("could not delete old scheme"): retry, re-listing each time
          ok=0; for a in 1 2 3; do SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c 'import json,sys; s=json.load(sys.stdin)["workspace"]["schemes"]; print(next((x for x in ["OLSfuHarness","OLSfuHarness-Package","OLSfu"] if x in s), s[0]))'); echo "HSCHEME=$SCHEME" >> $GITHUB_ENV
            if xcodebuild build-for-testing -scheme "$SCHEME" -destination "id=$SIM" -derivedDataPath $PWD/dd > ../../../xh.log 2>&1; then ok=1; break; fi; echo "attempt $a failed"; grep -iE "error:" ../../../xh.log | head -5; rm -rf .swiftpm/xcode/xcshareddata; sleep 10; done
          [ $ok = 1 ] || { grep -iE "error|BUILD" ../../../xh.log | head -40; exit 1; }
      - name: CI stack deps (wasm browser peer, mediasoup worker)
        working-directory: ol
        run: wasm-call/build.sh && for d in media-sfu ws-media-relay tests/pjsip-matrix; do (cd $d && npm install --no-audit --no-fund); done
      - name: virtual audio device (macOS VM has none -> headless Chrome AudioWorklet clock runs ~1/7 speed, starving browser->phone send)
        run: |
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true; sleep 5
          system_profiler SPAudioDataType | grep -iE "blackhole|output|input" | head
      - name: iphone<->browser audio + video cells (simulator XCTest, real engine + product HW VideoToolbox codec, real mediasoup PlainTransport)
        working-directory: ol
        env:
          PHONE: ios
          MEDIA: audio,video
          CELL_SECONDS: "30"
          IOS_TEST_CMD: cd $GITHUB_WORKSPACE/modules/openlounge-call-engine/ios-harness && xcodebuild test-without-building -scheme "$HSCHEME" -destination "id=$SIM" -derivedDataPath $PWD/dd -only-testing:OLSfuTests/SfuLegTests/testAudioLeg -resultBundlePath $RUNNER_TEMP/xcr/$(date +%s%N).xcresult 2>&1 | tee -a $GITHUB_WORKSPACE/xt.log; exit ${PIPESTATUS[0]}
        run: node tests/pjsip-matrix/run-phone.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: matrix-ios, path: "ol/tests/pjsip-matrix/results\nxh.log" }
      - name: XCTest failure messages (testVideoLeg/testAudioLeg)
        if: always()
        run: scripts/xcr-failures.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: xctest-results, path: "xcr-out\nxt.log\n${{ runner.temp }}/xcr" }
