# Signal-identical calling — Mac compile (WebRTC PeerConnection path).
# NEW workflow: do NOT extend .github/workflows/ios-xcframework.yml (pjsip-ios), which has
# hard anti-WebRTC guards for other branches. This workflow REQUIRES WebRTC.
name: signal-identical-ios
on:
  push:
    branches: [signal-identical-calling]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: signal-identical-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Leftover video helpers (ol_sfu_video / NativeCallMedia sources) still compile against pjproject.
  # Call audio/PC uses WebRTC only; physical PJSIP removal is a follow-up once video moves onto the PC.
  pjproject:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Try prior pjproject artifact (same repo)
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pj-art"
          AID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=pjproject-2.17-xcframework&per_page=20" \
            --jq '[.artifacts[] | select(.expired==false)][0].id // empty' || true)
          HID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=pjproject-2.17-headers&per_page=20" \
            --jq '[.artifacts[] | select(.expired==false)][0].id // empty' || true)
          if [[ -n "${AID:-}" && -n "${HID:-}" ]]; then
            echo "Downloading artifact ids xcframework=$AID headers=$HID"
            gh api "repos/${{ github.repository }}/actions/artifacts/$AID/zip" > "$RUNNER_TEMP/pj-xcf.zip"
            gh api "repos/${{ github.repository }}/actions/artifacts/$HID/zip" > "$RUNNER_TEMP/pj-hdr.zip"
            mkdir -p "$RUNNER_TEMP/pj-xcf" "$RUNNER_TEMP/pj-hdr"
            unzip -q "$RUNNER_TEMP/pj-xcf.zip" -d "$RUNNER_TEMP/pj-xcf"
            unzip -q "$RUNNER_TEMP/pj-hdr.zip" -d "$RUNNER_TEMP/pj-hdr"
            # Normalize layout → pjproject.xcframework/ + pjinclude/
            if [[ -f "$RUNNER_TEMP/pj-xcf/Info.plist" ]]; then
              mv "$RUNNER_TEMP/pj-xcf" "$RUNNER_TEMP/pj-art/pjproject.xcframework"
            elif [[ -d "$RUNNER_TEMP/pj-xcf/pjproject.xcframework" ]]; then
              mv "$RUNNER_TEMP/pj-xcf/pjproject.xcframework" "$RUNNER_TEMP/pj-art/pjproject.xcframework"
            else
              echo "Unexpected xcframework artifact layout:"; find "$RUNNER_TEMP/pj-xcf" | head -40; exit 1
            fi
            if [[ -d "$RUNNER_TEMP/pj-hdr/pj" || -f "$RUNNER_TEMP/pj-hdr/pjlib.h" ]]; then
              mv "$RUNNER_TEMP/pj-hdr" "$RUNNER_TEMP/pj-art/pjinclude"
            elif [[ -d "$RUNNER_TEMP/pj-hdr/pjinclude" ]]; then
              mv "$RUNNER_TEMP/pj-hdr/pjinclude" "$RUNNER_TEMP/pj-art/pjinclude"
            else
              echo "Unexpected headers artifact layout:"; find "$RUNNER_TEMP/pj-hdr" | head -40; exit 1
            fi
            test -f "$RUNNER_TEMP/pj-art/pjproject.xcframework/Info.plist"
            test -d "$RUNNER_TEMP/pj-art/pjinclude/pj"
            echo "hit=1" >> "$GITHUB_OUTPUT"
          else
            echo "No reusable prior artifact; will build."
            echo "hit=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build pjproject 2.17 (fallback)
        if: steps.prior.outputs.hit != '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pj-art"
          brew install cmake >/dev/null 2>&1 || true
          git clone -q --depth 1 -b 2.17 https://github.com/pjsip/pjproject.git
          git clone -q --depth 1 -b v1.5.2 https://github.com/xiph/opus.git
          for t in device:iphoneos sim:iphonesimulator; do n=${t%%:*}; sdk=${t##*:}
            cmake -S opus -B ob-$n -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=$sdk -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_INSTALL_PREFIX=$PWD/opus-$n -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF >/dev/null
            cmake --build ob-$n --target install -j4 >/dev/null
          done
          cd pjproject
          cat > pjlib/include/pj/config_site.h <<'C'
          #define PJ_CONFIG_IPHONE 1
          #define PJMEDIA_HAS_SRTP 1
          #define PJMEDIA_HAS_VIDEO 1
          #define PJMEDIA_HAS_VID_TOOLBOX_CODEC 1
          #include <pj/config_site_sample.h>
          C
          build() { make distclean >/dev/null 2>&1 || true
            env CXXFLAGS="-std=c++17" ARCH="-arch arm64" $1 ./configure-iphone --with-opus=$PWD/../opus-$2 >/dev/null
            grep -q "PJMEDIA_HAS_OPUS_CODEC 1" pjmedia/include/pjmedia-codec/config_auto.h && echo "opus ON ($2)"
            make dep >/dev/null 2>&1 && make -j4 >/dev/null
            mkdir -p ../out/$2; libtool -static -o ../out/$2/libpjproject.a $(find . -path ./pjsip-apps -prune -o -path "*/lib/*.a" -print | grep -v pjsua2 | grep -v libpjsdp) ../opus-$2/lib/libopus.a ; }
          build "" device
          build "DEVPATH=$(xcrun --sdk iphonesimulator --show-sdk-platform-path)/Developer MIN_IOS=-mios-simulator-version-min=15.0" sim
          mkdir -p ../out/include; for d in pjlib pjlib-util pjnath pjmedia pjsip; do cp -R $d/include/* ../out/include/; done
          cd ..
          xcodebuild -create-xcframework -library out/device/libpjproject.a -library out/sim/libpjproject.a -output "$RUNNER_TEMP/pj-art/pjproject.xcframework"
          mv out/include "$RUNNER_TEMP/pj-art/pjinclude"
      - uses: actions/upload-artifact@v4
        with:
          name: signal-pjproject-2.17-xcframework
          path: ${{ runner.temp }}/pj-art/pjproject.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: signal-pjproject-2.17-headers
          path: ${{ runner.temp }}/pj-art/pjinclude

  compile:
    needs: pjproject
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: HARD GATE — AVAudioSession only in OLAudioSessionOwner (no bypass)
        run: bash scripts/check-audio-session-owner.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bridge gate (rtcP2P must be advertised)
        run: node scripts/check-bridge.cjs
      - name: Typecheck
        run: npx tsc --noEmit
      - uses: actions/download-artifact@v4
        with:
          name: signal-pjproject-2.17-xcframework
          path: modules/openlounge-call-engine/ios/pjproject.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: signal-pjproject-2.17-headers
          path: modules/openlounge-call-engine/ios/pjinclude
      - name: Fetch interim BSD WebRTC.xcframework (M152)
        env:
          # Job-level env cannot use runner.*; set cache under RUNNER_TEMP here.
          OL_WEBRTC_IOS_CACHE: ${{ runner.temp }}/webrtc-bsd-m152-ios
        run: |
          set -euo pipefail
          bash scripts/ios-fetch-webrtc.sh
          test -f modules/openlounge-call-engine/ios/WebRTC.xcframework/Info.plist
          test -d modules/openlounge-call-engine/ios/WebRTC.xcframework/ios-arm64
          # Gate must still pass with framework on disk (WebRTC headers excluded).
          bash scripts/check-audio-session-owner.sh
      - name: REQUIRE — podspec will vendor WebRTC when present
        run: |
          set -euo pipefail
          ruby -e '
            dir = "modules/openlounge-call-engine/ios"
            abort("WebRTC.xcframework missing") unless File.exist?(File.join(dir, "WebRTC.xcframework"))
            abort("pjproject.xcframework missing") unless File.exist?(File.join(dir, "pjproject.xcframework"))
            # Mirror OpenLoungeCallEngine.podspec vendored_frameworks expression.
            vf = ["pjproject.xcframework"] + (File.exist?(File.join(dir, "WebRTC.xcframework")) ? ["WebRTC.xcframework"] : [])
            abort("podspec would omit WebRTC") unless vf.include?("WebRTC.xcframework")
            puts "vendored: #{vf.join(" + ")}"
          '
      - name: prebuild + simulator Debug (unsigned) — WebRTC REQUIRED
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install --clean
          cd ios && pod install
          # CocoaPods does NOT put vendored_frameworks basenames into Podfile.lock.
          # Prove OpenLoungeCallEngine installed and WebRTC.xcframework was wired into the Pods project.
          grep -q 'OpenLoungeCallEngine' Podfile.lock || { echo "FAIL: OpenLoungeCallEngine missing from Podfile.lock"; exit 1; }
          test -d ../modules/openlounge-call-engine/ios/WebRTC.xcframework \
            || { echo "FAIL: WebRTC.xcframework missing after pod install"; exit 1; }
          grep -q 'WebRTC.xcframework' Pods/Pods.xcodeproj/project.pbxproj \
            || { echo "FAIL: WebRTC.xcframework not referenced in Pods project (podspec did not vendor it)"; exit 1; }
          echo "OK: OpenLoungeCallEngine in lock + WebRTC.xcframework in Pods project"
          WS=$(ls -d *.xcworkspace | head -1); SCHEME=${WS%.xcworkspace}
          echo "WS=$WS SCHEME=$SCHEME"
          rm -rf ~/Library/Developer/Xcode/DerivedData
          set +e
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath "$PWD/dd" clean build > ../xb.log 2>&1
          rc=$?
          set -e
          grep -E ' error: |\*\* BUILD' ../xb.log | sort -u | head -80 || true
          exit $rc
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-identical-xb-log
          path: xb.log
          if-no-files-found: warn
      - name: REQUIRE — WebRTC linked / canImport path compiled
        run: |
          set -euo pipefail
          APP=$(find ios/dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          test -n "$APP" || { echo "FAIL: no .app under ios/dd/Build/Products"; exit 1; }
          echo "APP=$APP"
          # Framework embedded or static symbols from WebRTC must be present (invert of pjsip-ios anti-WebRTC grep).
          if find "$APP" -iname '*WebRTC*' | grep -q .; then
            echo "OK: WebRTC framework/bundle present in app:"
            find "$APP" -iname '*WebRTC*' | head -20
          else
            BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
            echo "No WebRTC.framework path; checking symbols in $BIN"
            (nm -a "$BIN" 2>/dev/null || true; nm -gU "$BIN" 2>/dev/null || true) | grep -iE 'RTCPeerConnection|OBJC_CLASS\$_RTCPeerConnection|WebRTC' | head -20 \
              || { echo "FAIL: WebRTC not linked into $BIN"; exit 1; }
            echo "OK: WebRTC symbols found in binary"
          fi
          # Confirm Swift sources that gate on canImport(WebRTC) are part of the engine target.
          grep -q 'canImport(WebRTC)' modules/openlounge-call-engine/ios/OLCallAudioEngine.swift
          grep -q 'canImport(WebRTC)' modules/openlounge-call-engine/ios/OLRtcCall.swift
          echo "OK: canImport(WebRTC) path present; Mac build linked WebRTC"

  # Ad-hoc IPA for device matrix (Signal-identical: WebRTC + pjproject video leftovers).
  # Do NOT host on /download until Donny says build. Artifact is passphrase-encrypted.
  adhoc:
    needs: pjproject
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: HARD GATE — AVAudioSession only in OLAudioSessionOwner (no bypass)
        run: bash scripts/check-audio-session-owner.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bridge gate (rtcP2P must be advertised)
        run: node scripts/check-bridge.cjs
      - name: Typecheck
        continue-on-error: true
        run: npx tsc --noEmit
      - uses: actions/download-artifact@v4
        with:
          name: signal-pjproject-2.17-xcframework
          path: modules/openlounge-call-engine/ios/pjproject.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: signal-pjproject-2.17-headers
          path: modules/openlounge-call-engine/ios/pjinclude
      - name: Fetch interim BSD WebRTC.xcframework (M152)
        env:
          OL_WEBRTC_IOS_CACHE: ${{ runner.temp }}/webrtc-bsd-m152-ios
        run: |
          set -euo pipefail
          bash scripts/ios-fetch-webrtc.sh
          test -f modules/openlounge-call-engine/ios/WebRTC.xcframework/Info.plist
          test -d modules/openlounge-call-engine/ios/WebRTC.xcframework/ios-arm64
          # Gate must still pass with framework on disk (WebRTC headers excluded).
          bash scripts/check-audio-session-owner.sh
      - name: REQUIRE — podspec will vendor WebRTC when present
        run: |
          set -euo pipefail
          ruby -e '
            dir = "modules/openlounge-call-engine/ios"
            abort("WebRTC.xcframework missing") unless File.exist?(File.join(dir, "WebRTC.xcframework"))
            abort("pjproject.xcframework missing") unless File.exist?(File.join(dir, "pjproject.xcframework"))
            vf = ["pjproject.xcframework"] + (File.exist?(File.join(dir, "WebRTC.xcframework")) ? ["WebRTC.xcframework"] : [])
            abort("podspec would omit WebRTC") unless vf.include?("WebRTC.xcframework")
            puts "vendored: #{vf.join(" + ")}"
          '
      - name: Signing assets (existing Apple Distribution cert + ad hoc profile)
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_ADHOC_PROFILE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p credentials/ios
          printf '%s' "$P12_B64" | base64 --decode > credentials/ios/dist.p12
          printf '%s' "$PROFILE_B64" | base64 --decode > credentials/ios/adhoc.mobileprovision
          node -e 'require("fs").writeFileSync("credentials.json", JSON.stringify({ios:{provisioningProfilePath:"credentials/ios/adhoc.mobileprovision",distributionCertificate:{path:"credentials/ios/dist.p12",password:process.env.P12_PASSWORD}}}))'
      - name: eas build --local (preview = ad hoc, Release) — WebRTC REQUIRED
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          # Frameworks live under modules/.../ios/ and survive expo prebuild of app ios/.
          test -f modules/openlounge-call-engine/ios/WebRTC.xcframework/Info.plist
          test -f modules/openlounge-call-engine/ios/pjproject.xcframework/Info.plist
          sudo gem install cocoapods --no-document >/dev/null 2>&1 || true
          mkdir -p out
          npx --yes eas-cli@latest build --local --platform ios --profile preview --non-interactive --output "$PWD/out/OpenLounge.ipa"
      - name: Verify signature + WebRTC in IPA + Donny Dev UDID
        run: |
          set -euo pipefail
          cd out && rm -rf x && mkdir x && cd x && unzip -q ../OpenLounge.ipa
          APP=$(ls -d Payload/*.app)
          codesign --verify --deep --strict "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier"
          security cms -D -i "$APP/embedded.mobileprovision" > ../profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Name' ../profile.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          grep -q 00008110-000E7DD63C03801E ../profile.plist && echo "Donny Dev in profile"
          # Require WebRTC in the device IPA (framework path or linked symbols).
          if find "$APP" -iname '*WebRTC*' | grep -q .; then
            echo "OK: WebRTC present in IPA:"
            find "$APP" -iname '*WebRTC*' | head -20
          else
            BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
            (nm -a "$BIN" 2>/dev/null || true; nm -gU "$BIN" 2>/dev/null || true) | grep -iE 'RTCPeerConnection|OBJC_CLASS\$_RTCPeerConnection|WebRTC' | head -20 \
              || { echo "FAIL: WebRTC not in IPA binary $BIN"; exit 1; }
            echo "OK: WebRTC symbols found in IPA binary"
          fi
          cd .. && rm -rf x
      - name: Encrypt IPA (public repo, artifact is passphrase-encrypted)
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.IOS_ARTIFACT_PASSPHRASE }}
        run: |
          set -euo pipefail
          shasum -a 256 out/OpenLounge.ipa | tee out/OpenLounge.ipa.sha256
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in out/OpenLounge.ipa -out out/OpenLounge.ipa.enc -pass env:ARTIFACT_PASSPHRASE
          rm -f out/OpenLounge.ipa credentials/ios/dist.p12 credentials.json
      - uses: actions/upload-artifact@v4
        with:
          name: openlounge-ios-signal-adhoc-encrypted
          path: |
            out/OpenLounge.ipa.enc
            out/OpenLounge.ipa.sha256
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf credentials credentials.json out/OpenLounge.ipa
