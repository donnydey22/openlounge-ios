name: iOS ad hoc build (eas --local on macOS)
on:
  push:
    branches: [feat/audio-route-udp-first, ios75-native-streamwebrtc]
    paths-ignore: ['**.md']
permissions:
  contents: read
concurrency:
  group: ios-adhoc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and call-audio tests
        run: |
          set -euo pipefail
          node --test tests/*.mjs
          npx --yes tsx --test tests/*.mts tests/*.ts
          node scripts/check-bridge.cjs
      - name: Typecheck
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Signing assets (existing Apple Distribution cert + ad hoc profile)
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_ADHOC_PROFILE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p credentials/ios
          printf '%s' "$P12_B64" | base64 --decode > credentials/ios/dist.p12
          printf '%s' "$PROFILE_B64" | base64 --decode > credentials/ios/adhoc.mobileprovision
          node -e 'require("fs").writeFileSync("credentials.json", JSON.stringify({ios:{provisioningProfilePath:"credentials/ios/adhoc.mobileprovision",distributionCertificate:{path:"credentials/ios/dist.p12",password:process.env.P12_PASSWORD}}}))'
      - name: eas build --local (preview = ad hoc, Release)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          sudo gem install cocoapods --no-document >/dev/null 2>&1 || true
          npx --yes eas-cli@latest build --local --platform ios --profile preview --non-interactive --output "$PWD/out/OpenLounge.ipa"
      - name: Verify signature
        run: |
          set -euo pipefail
          cd out && rm -rf x && mkdir x && cd x && unzip -q ../OpenLounge.ipa
          APP=$(ls -d Payload/*.app)
          codesign --verify --deep --strict "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier"
          security cms -D -i "$APP/embedded.mobileprovision" > ../profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Name' ../profile.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          grep -q 00008110-000E7DD63C03801E ../profile.plist && echo "Donny Dev in profile"
          cd .. && rm -rf x
      - name: b75 link audit (exactly one WebRTC, zero duplicate RTC* ObjC classes)
        run: |
          set -euo pipefail
          cd out && rm -rf la && mkdir la && cd la && unzip -q ../OpenLounge.ipa
          APP=$(ls -d Payload/*.app); BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "== embedded frameworks"; ls "$APP/Frameworks" || true
          WF=$(find "$APP" -iname '*webrtc*' -maxdepth 3 | tee /dev/stderr | grep -ci '\.framework$' || true)
          echo "WebRTC framework count: $WF"
          echo "== main binary links (otool -L)"; otool -L "$BIN" | grep -i -E 'webrtc|mediasoup' || echo "(main binary does not link WebRTC directly)"
          echo "== mediasoup/libwebrtc artifacts"; find "$APP" -iname '*mediasoup*' -o -iname 'libwebrtc*' | tee ../ms.txt; test ! -s ../ms.txt
          : > ../defs.txt
          for img in "$BIN" $(find "$APP/Frameworks" -type f -perm +111 2>/dev/null) $(find "$APP/Frameworks" -name '*.framework' -maxdepth 1 | while read f; do echo "$f/$(basename "$f" .framework)"; done); do
            [ -f "$img" ] || continue
            nm -gU "$img" 2>/dev/null | awk '$3 ~ /^_OBJC_CLASS_\$_RTC/ {print $3}' | sort -u | sed "s|^|$(basename "$img") |" >> ../defs.txt || true
          done
          sort -u ../defs.txt -o ../defs.txt
          echo "== images defining RTC* classes:"; awk '{print $1}' ../defs.txt | sort | uniq -c
          DUP=$(awk '{print $2}' ../defs.txt | sort | uniq -d | wc -l | tr -d ' ')
          echo "Duplicate RTC* ObjC classes across images: $DUP"
          echo "RTCPeerConnection definers:"; grep '_OBJC_CLASS_\$_RTCPeerConnection$' ../defs.txt || true
          test "$WF" = "1" && test "$DUP" = "0" && echo "LINK AUDIT PASS"
          cd .. && rm -rf la
      - name: b75 installable IPA (short-lived; same file is published as a release asset like b74)
        if: github.ref == 'refs/heads/ios75-native-streamwebrtc'
        uses: actions/upload-artifact@v4
        with:
          name: openlounge-ios-adhoc-ipa
          path: out/OpenLounge.ipa
          retention-days: 1
      - name: Encrypt IPA (public repo, artifact is passphrase-encrypted)
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.IOS_ARTIFACT_PASSPHRASE }}
        run: |
          set -euo pipefail
          shasum -a 256 out/OpenLounge.ipa | tee out/OpenLounge.ipa.sha256
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in out/OpenLounge.ipa -out out/OpenLounge.ipa.enc -pass env:ARTIFACT_PASSPHRASE
          rm -f out/OpenLounge.ipa credentials/ios/dist.p12 credentials.json
      - uses: actions/upload-artifact@v4
        with:
          name: openlounge-ios-adhoc-encrypted
          path: |
            out/OpenLounge.ipa.enc
            out/OpenLounge.ipa.sha256
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf credentials credentials.json out/OpenLounge.ipa
