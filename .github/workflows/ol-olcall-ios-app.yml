# Open Lounge iOS app + olcall (tgcalls <-> olcall Go/Pion, wss://<host>/v1/call): COMPILE ONLY.
# Simulator Debug, unsigned. No signing, no IPA, no upload anywhere, no /download. Branch ol-olcall-ios-app only.
# TgVoipWebrtc.xcframework (Telegram's engine, the ONLY WebRTC in the app) comes from the oltgcalls-swift-ios artifact
# of the run id in modules/openlounge-olcall/ios/xcf-seed-run.txt; it is never committed. Every run RE-PUBLISHES it as
# this run's artifact `oltgcalls-swift-ios` with the repo maximum retention (90 days), so pointing xcf-seed-run.txt at
# the latest green run of this workflow keeps it alive indefinitely (no Nov 24 expiry, no 1.3 GB commit).
# Required: JS tests + bridge check + typecheck, audio-session owner gate, build, tgcalls linked, 0 duplicate ObjC classes.
name: ol-olcall-ios-app

on:
  push:
    branches: [ol-olcall-ios-app]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read   # download the TgVoipWebrtc.xcframework artifact from the seed run (uploads use the runtime token)

concurrency:
  group: ol-olcall-ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: REQUIRE — audio-session owner gate (two scoped owners — OLCallAudioDevice in olcall calls, OLAudioSessionOwner outside)
        run: bash scripts/check-audio-session-owner.sh
      - name: xcframework seed run id
        id: seed
        run: echo "run=$(tr -dc '0-9' < modules/openlounge-olcall/ios/xcf-seed-run.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: oltgcalls-swift-ios
          path: seed
          run-id: ${{ steps.seed.outputs.run }}
          github-token: ${{ github.token }}
      - name: Unpack TgVoipWebrtc.xcframework into modules/openlounge-olcall/ios/Frameworks
        run: |
          set -euo pipefail
          z="$(find seed -name TgVoipWebrtc.xcframework.zip | head -n1)"
          test -n "$z" || { echo "FAIL: seed artifact has no TgVoipWebrtc.xcframework.zip"; exit 1; }
          dst=modules/openlounge-olcall/ios/Frameworks
          rm -rf "$dst" && mkdir -p "$dst"
          ditto -x -k "$z" "$dst"
          mkdir -p xcf-cache && mv "$z" xcf-cache/TgVoipWebrtc.xcframework.zip
          shasum -a 256 xcf-cache/TgVoipWebrtc.xcframework.zip
          rm -rf seed
          test -f "$dst/TgVoipWebrtc.xcframework/Info.plist"
          ls "$dst/TgVoipWebrtc.xcframework"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: REQUIRE — JS tests (node:test), bridge contract, typecheck
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          node --experimental-strip-types --test tests/nativeCallFlow.test.ts
          npx --yes tsx@4 --test tests/pushPayload.test.ts
          node scripts/check-bridge.cjs
          npx tsc --noEmit
      - name: REQUIRE — no second WebRTC in the source tree
        run: |
          set -euo pipefail
          if find . -path ./node_modules -prune -o -name 'WebRTC.xcframework' -print | grep -q .; then echo "FAIL: WebRTC.xcframework present"; exit 1; fi
          if grep -rn "WebRTC.xcframework" modules --include='*.podspec' | grep -vE ':[0-9]+:[[:space:]]*#' | grep -v TgVoipWebrtc; then echo "FAIL: a podspec still vendors WebRTC.xcframework"; exit 1; fi
          echo "OK: only TgVoipWebrtc.xcframework is vendored"
      - name: prebuild + pod install + simulator Debug build (unsigned)
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install --clean
          cd ios && pod install
          grep -q 'OpenLoungeOlcall' Podfile.lock || { echo "FAIL: OpenLoungeOlcall missing from Podfile.lock"; exit 1; }
          grep -q 'TgVoipWebrtc.xcframework' Pods/Pods.xcodeproj/project.pbxproj || { echo "FAIL: TgVoipWebrtc.xcframework not vendored"; exit 1; }
          if grep -E '(^|[^A-Za-z])WebRTC\.xcframework|WebRTC-SDK|GoogleWebRTC|JitsiWebRTC|livekit-webrtc|react-native-webrtc' Podfile.lock Pods/Pods.xcodeproj/project.pbxproj | grep -v TgVoipWebrtc | head; then
            echo "FAIL: a second WebRTC is linked by a pod"; exit 1; fi
          WS=$(ls -d *.xcworkspace | head -1); SCHEME=${WS%.xcworkspace}
          echo "WS=$WS SCHEME=$SCHEME"
          set +e
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath "$PWD/dd" build > ../xb.log 2>&1
          rc=$?
          set -e
          grep -E ' error: |duplicate symbol|\*\* BUILD' ../xb.log | sort -u | head -120 || true
          exit $rc
      - name: REQUIRE — tgcalls engine + olcall routing linked into the app
        run: |
          set -euo pipefail
          APP=$(find ios/dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          # Xcode 16+ Debug builds put the app's code in <App>.debug.dylib (the main binary is a stub): scan every Mach-O.
          find "$APP" -maxdepth 1 -type f \( -name "*.dylib" -o -perm -111 \) > bins.txt
          cat bins.txt
          while read -r b; do nm -a "$b" 2>/dev/null || true; done < bins.txt > syms.txt
          echo "symbols: $(wc -l < syms.txt)"
          grep -m3 -F 'OBJC_CLASS_$_OngoingCallThreadLocalContextWebrtc' syms.txt || { echo "FAIL: TgVoipWebrtc not linked"; exit 1; }
          grep -m3 -E 'OLSignalingRelay|OLRtcServers|OLCallRoute|OLCallStates' syms.txt || { echo "FAIL: olcall Swift not linked"; exit 1; }
          echo "OK: tgcalls (TgVoipWebrtc) + OLSignalingRelay/OLRtcServers/OLCallRoute linked"
      - name: REQUIRE — zero duplicate ObjC classes in the built app (static, every Mach-O image)
        run: |
          set -euo pipefail
          APP=$(find ios/dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          : > imgs.txt
          while IFS= read -r -d '' f; do file -b "$f" | grep -q 'Mach-O' && echo "$f" >> imgs.txt || true; done < <(find "$APP" -type f -print0)
          echo "Mach-O images: $(wc -l < imgs.txt)"; sed "s|$APP/||" imgs.txt
          : > defs.txt
          while read -r b; do nm -U "$b" 2>/dev/null | grep -oE '_OBJC_CLASS_\$_[A-Za-z0-9_.]+' | sort -u | awk -v img="${b#$APP/}" '{print $0 "\t" img}' >> defs.txt || true; done < imgs.txt
          # (a) a class defined in more than one image = the runtime "Class X is implemented in both" duplicate
          cut -f1 defs.txt | sort | uniq -d > dup.txt
          # (b) the old 52: Telegram engine classes also defined by any other image (TgVoipWebrtc is static -> app image)
          tg=modules/openlounge-olcall/ios/Frameworks/TgVoipWebrtc.xcframework/ios-arm64-simulator/TgVoipWebrtc.framework/TgVoipWebrtc
          nm -gU "$tg" 2>/dev/null | grep -oE '_OBJC_CLASS_\$_[A-Za-z0-9_.]+' | sort -u > tg.txt
          echo "TgVoipWebrtc ObjC classes: $(wc -l < tg.txt); ObjC class definitions in app: $(wc -l < defs.txt); defined in >1 image: $(wc -l < dup.txt)"
          if find "$APP" -iname 'WebRTC.framework' | grep -q .; then echo "FAIL: WebRTC.framework embedded"; exit 1; fi
          test "$(wc -l < tg.txt)" -gt 0 || { echo "FAIL: could not read TgVoipWebrtc classes"; exit 1; }
          if [ -s dup.txt ]; then echo "FAIL: duplicate ObjC classes:"; head -n 80 dup.txt; exit 1; fi
          echo "DUPLICATE_OBJC_CLASSES=0"
      - name: REQUIRE — zero duplicate ObjC classes at runtime (simulator launch, objc 'implemented in both')
        run: |
          set -uo pipefail
          APP=$(find ios/dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "sim=$UDID bundle=$BID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          ( xcrun simctl launch --console-pty --terminate-running-process "$UDID" "$BID" > launch.log 2>&1 & echo $! > lp )
          sleep 25
          kill "$(cat lp)" 2>/dev/null || true
          xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
          echo "launch log lines: $(wc -l < launch.log)"; head -n 20 launch.log
          n=$(grep -c 'is implemented in both' launch.log || true)
          echo "RUNTIME_DUPLICATE_OBJC_CLASSES=$n"
          grep 'is implemented in both' launch.log | head -n 60 || true
          test "$n" -eq 0
      - name: Re-publish TgVoipWebrtc.xcframework (max retention) — durable seed for xcf-seed-run.txt
        uses: actions/upload-artifact@v4
        with:
          name: oltgcalls-swift-ios
          path: xcf-cache/TgVoipWebrtc.xcframework.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ol-olcall-ios-app-xb-log
          path: |
            xb.log
            dup.txt
            defs.txt
            tg.txt
            launch.log
          if-no-files-found: warn
          retention-days: 14
