# XcodeGen spec for the Open Lounge iOS app. ci/build.sh runs `xcodegen generate`.
name: OpenLounge
options:
  bundleIdPrefix: com.donnydey
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
packages:
  OLCall:
    path: OLCall
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "130"
    # Unsigned unless ci/adhoc.sh passes these on the command line (app target only).
    OL_SIGNING_ALLOWED: "NO"
    OL_PROFILE: ""
    OL_SIGN_IDENTITY: ""
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ENABLE_BITCODE: NO
targets:
  OpenLounge:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - OpenLounge.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donnydey.openlounge
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/OpenLounge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        DEVELOPMENT_TEAM: 9A6NA2ZAFH
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "$(OL_SIGNING_ALLOWED)"
        CODE_SIGN_IDENTITY: "$(OL_SIGN_IDENTITY)"
        PROVISIONING_PROFILE_SPECIFIER: "$(OL_PROFILE)"
    dependencies:
      - package: OLCall
        product: OLCall
      - package: OLCall
        product: OLCallCore
      - package: OLCall
        product: OLShellCore
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAuth
schemes:
  OpenLounge:
    build:
      targets:
        OpenLounge: all
